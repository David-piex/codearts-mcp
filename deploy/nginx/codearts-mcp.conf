upstream codearts_mcp_upstream {
    server codearts-mcp:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    location /health {
        proxy_pass http://codearts_mcp_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /diagnostics/session-reuse {
        proxy_pass http://codearts_mcp_upstream/diagnostics/session-reuse;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /mcp {
        return 404;
    }

    location ~ ^/mcp/([a-z]+)$ {
        proxy_pass http://codearts_mcp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
        proxy_buffering off;
    }
}
