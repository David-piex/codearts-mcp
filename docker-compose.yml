services:
  codearts-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codearts-mcp
    env_file:
      - .env
    environment:
      - MCP_TRANSPORT=http
      - MCP_HTTP_PORT=3000
      - MCP_HTTP_HOST=0.0.0.0
      - MCP_HTTP_SESSION_IDLE_TIMEOUT_MS=${MCP_HTTP_SESSION_IDLE_TIMEOUT_MS:-0}
      - MCP_HTTP_MAX_SESSIONS=${MCP_HTTP_MAX_SESSIONS:-128}
      - MCP_HTTP_MAX_REQUEST_BODY_BYTES=${MCP_HTTP_MAX_REQUEST_BODY_BYTES:-8388608}
      - MCP_HTTP_ALLOWED_ORIGINS=${MCP_HTTP_ALLOWED_ORIGINS:-}
      - NODE_OPTIONS=${NODE_OPTIONS:---max-old-space-size=2560}
      - MCP_SERVER_NAME=codearts-mcp
      - MCP_SERVER_VERSION=0.1.0
      - MCP_AUTH_MASTER_KEY=${MCP_AUTH_MASTER_KEY}
      - MCP_AUTH_DATA_PATH=${MCP_AUTH_DATA_PATH:-/app/.codearts-mcp/auth-store.json}
      - MCP_AUTH_COOKIE_NAME=${MCP_AUTH_COOKIE_NAME:-codearts_mcp_auth}
      - MCP_AUTH_COOKIE_SECURE=${MCP_AUTH_COOKIE_SECURE:-false}
      - MCP_AUTH_TOKEN_TTL_SECONDS=${MCP_AUTH_TOKEN_TTL_SECONDS:-2592000}
      - MCP_AUTH_STATIC_TOKEN=${MCP_AUTH_STATIC_TOKEN:-}
      - MCP_AUTH_ALLOW_CLIENT_CREDENTIAL_HEADERS=${MCP_AUTH_ALLOW_CLIENT_CREDENTIAL_HEADERS:-false}
    volumes:
      - ./.codearts-mcp:/app/.codearts-mcp
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: codearts-mcp-nginx
    depends_on:
      codearts-mcp:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/codearts-mcp.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
